task: "reference_relative_physical"

data:
  root: "E:/Lighting Enhancement Project/RRNet/MEAD for RRNet/dataset"
  metadata_file: "metadata.csv"
  use_masks: true
  sampling_seed: 20260924
  # One dataset item is a four-member group, not four unrelated pairs.
  reference_variants_per_source: 4
  reference_dynamic_epoch: true
  physical_group_size: 4
  # In 80% of groups, different input lights share one reference and target.
  # In 20%, the input stays fixed while dark/normal reference changes.
  reference_sensitivity_fraction: 0.20
  validation_physical_group_size: 4
  validation_reference_sensitivity_fraction: 0.00
  # First train only two usable meeting-master-light regimes. Bright/overexposed
  # reference is intentionally excluded; directional/mixed lights are source-only.
  reference_lighting_weights:
    dark: 0.50
    normal: 0.50
    bright: 0.00

model:
  num_lights: 9
  shorter_side: 512
  coarse_factor: 4
  use_agm: false
  depth_vendor_root: "third_party/Depth-Anything-V2"
  depth_checkpoint: "checkpoints/depth_anything_v2_vits.pth"
  depth_input_size: 448
  depth_invert: false
  allow_depth_proxy: false
  # Keep the repository's neutral parameter prior. Historical fitted
  # statistics encode the ambiguous/partly non-physical decomposition.
  statistics_path: null
  agm_channels: 64
  sigma1: 0.10
  sigma2: 0.05
  clamp_output: true
  enforce_physical_parameters: true
  illumination_floor: 0.05
  min_transfer_gain: 0.40
  max_transfer_gain: 5.00
  achromatic_illumination: true
  preserve_chromaticity: true
  output_headroom: 0.999

loss:
  num_lights: 9
  sigma_c: 0.10
  sigma_l: 0.10
  lambda_reg: 0.01
  lambda_ambient: 1.0
  ambient_max: 2.0
  pixel_loss: "l1"
  lambda_skin: 0.50
  lambda_highlight: 0.30
  lambda_background: 1.0
  highlight_threshold: 0.95
  highlight_margin: 0.03
  lambda_dark: 0.30
  dark_lift_threshold: 0.03
  dark_source_max: 0.65
  dark_mode: "symmetric"
  lambda_chroma: 0.00
  lambda_source_illumination: 1.00
  lambda_reference_illumination: 1.00
  lambda_target_illumination: 1.00
  illumination_target_floor: 0.04
  illumination_target_max: 5.00
  lambda_gain: 1.00
  gain_target_floor: 0.025
  gain_target_min: 0.40
  gain_target_max: 5.00
  lambda_gain_gradient: 0.50
  gain_gradient_scales: [1, 2, 4]
  # Explicitly make different Lin variants converge when their Lref is fixed.
  lambda_consistency: 0.50
  lambda_dark_log_lift: 0.10
  dark_log_lift_threshold: 0.03
  dark_log_source_max: 0.20
  dark_log_epsilon: 0.001
  # Direct supervision is possible only in the new exact physical-pair task.
  lambda_theta_source: 0.50
  lambda_theta_reference: 0.50

video:
  theta_beta: 0.95

training:
  learning_rate: 5.0e-5
  scheduler: "warmup_cosine"
  warmup_steps: 300
  warmup_start_factor: 0.10
  min_learning_rate: 1.0e-6
  iterations: 3000
  # Each dataset item contains four rendered images; effective image batch is 4.
  batch_size: 1
  workers: 2
  amp: true
  log_every: 100
  validate_every: 500
  validation_batches: 20
  save_every: 500
  reset_light_heads_on_init: true
  freeze_encoder_steps: 300
  output_dir: "outputs/rrnet_mead_reference_relative_physical_pilot"
