# Stage 2: start from a successful physical-pair pilot checkpoint, then adapt
# to the existing MEAD degradations without discarding the physical renderer.
task: "reference_relative"

data:
  root: "E:/Lighting Enhancement Project/RRNet/MEAD for RRNet/dataset"
  metadata_file: "metadata.csv"
  manifest_file: "generation_manifest.json"
  use_masks: true
  sampling_seed: 20260925
  reference_variants_per_source: 4
  reference_dynamic_epoch: true
  # Four different generated Lin conditions share one Lref and Lout.
  grouped_source_count: 4
  validation_grouped_source_count: 4
  source_category_weights:
    identity: 0.10
    underexposed_cool: 0.25
    window_backlight: 0.20
    mixed_office: 0.15
    top_light_shadow: 0.10
    warm_side_light: 0.10
    warm_overexposure: 0.10
  target_category_weights:
    # First-stage meeting references: normal or dark only. Do not use the
    # warm-overexposed set as a "bright" reference. Complex lights are source-only.
    identity: 0.50             # normal
    underexposed_cool: 0.50    # dark
    warm_overexposure: 0.00
    window_backlight: 0.00
    mixed_office: 0.00
    top_light_shadow: 0.00
    warm_side_light: 0.00

model:
  num_lights: 9
  shorter_side: 512
  coarse_factor: 4
  use_agm: false
  depth_vendor_root: "third_party/Depth-Anything-V2"
  depth_checkpoint: "checkpoints/depth_anything_v2_vits.pth"
  depth_input_size: 448
  depth_invert: false
  allow_depth_proxy: false
  statistics_path: null
  agm_channels: 64
  sigma1: 0.10
  sigma2: 0.05
  clamp_output: true
  enforce_physical_parameters: true
  illumination_floor: 0.05
  min_transfer_gain: 0.40
  max_transfer_gain: 5.00
  achromatic_illumination: true
  preserve_chromaticity: true
  output_headroom: 0.999

loss:
  num_lights: 9
  sigma_c: 0.10
  sigma_l: 0.10
  lambda_reg: 0.01
  lambda_ambient: 1.0
  ambient_max: 2.0
  pixel_loss: "l1"
  lambda_skin: 0.50
  lambda_highlight: 0.30
  lambda_background: 1.0
  highlight_threshold: 0.95
  highlight_margin: 0.03
  lambda_dark: 0.50
  dark_lift_threshold: 0.03
  dark_source_max: 0.65
  dark_mode: "symmetric"
  lambda_chroma: 0.00
  lambda_source_illumination: 0.75
  lambda_reference_illumination: 0.75
  lambda_target_illumination: 1.00
  illumination_target_floor: 0.04
  illumination_target_max: 5.00
  lambda_gain: 1.00
  gain_target_floor: 0.025
  gain_target_min: 0.40
  gain_target_max: 5.00
  lambda_gain_gradient: 0.25
  gain_gradient_scales: [1, 2, 4]
  lambda_consistency: 0.50
  lambda_dark_log_lift: 0.15
  dark_log_lift_threshold: 0.03
  dark_log_source_max: 0.20
  dark_log_epsilon: 0.001
  lambda_theta_source: 0.00
  lambda_theta_reference: 0.00

video:
  theta_beta: 0.95

training:
  learning_rate: 2.0e-5
  scheduler: "warmup_cosine"
  warmup_steps: 300
  warmup_start_factor: 0.20
  min_learning_rate: 1.0e-6
  iterations: 10000
  # Each loader item already contains four input-light variants.
  batch_size: 1
  workers: 2
  amp: true
  log_every: 500
  validate_every: 1000
  validation_batches: 40
  save_every: 1000
  output_dir: "outputs/rrnet_mead_reference_relative_physical_finetune"
